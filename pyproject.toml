[project]
name = "jevkit-workspace"
version = "0.0.0"
description = "Workspace root for the jevkit Python packages. Not published."
requires-python = ">=3.10"
dependencies = [
  "jevkit-core",
  "jevkit-lint",
  "jevkit-pytest",
  "jevkit-drift",
  "jevkit-calibrate",
  "jevkit-bench",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
jevkit-core = { workspace = true }
jevkit-lint = { workspace = true }
jevkit-pytest = { workspace = true }
jevkit-drift = { workspace = true }
jevkit-calibrate = { workspace = true }
jevkit-bench = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
