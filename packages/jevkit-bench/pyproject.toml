[project]
name = "jevkit-bench"
version = "0.1.0"
description = "Score a labeled TypeSafe Jev suite for accuracy and cost, and compare two runs. Catches regressions aggregate accuracy hides."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Prajjwal Chittori" }]
keywords = ["jev", "typesafe", "system-one", "benchmark", "evaluation", "accuracy", "cost"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = ["jevkit-core>=0.2.0"]

[project.scripts]
jevkit-bench = "jevkit_bench.cli:main"

[project.urls]
Homepage = "https://github.com/pjdurden/jevkit-py"
Issues = "https://github.com/pjdurden/jevkit-py/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevkit_bench"]
